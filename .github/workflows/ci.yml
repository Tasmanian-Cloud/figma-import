name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.94+
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.0 fmt --all -- --check
      - name: Build
        run: cargo +1.94.0 build --locked --all-targets
      - name: Test
        run: cargo +1.94.0 test --locked
      - name: Clippy
        run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings
