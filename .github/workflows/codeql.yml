name: CodeQL

# Static analysis on every push to main and every PR so the SAST check
# (scorecard.dev) sees full coverage; weekly sweep as a backstop.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's Default Setup for code scanning and the advanced (workflow)
      # configuration are mutually exclusive — with default setup enabled the
      # analyze upload is rejected. Detect it and yield: default setup keeps
      # analyzing pushes and PRs at the platform level; flip the repository
      # setting to not-configured and this workflow takes over.
      - name: Detect default setup
        id: default_setup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/code-scanning/default-setup" --jq '.state' 2>/dev/null || echo unknown)
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
      - name: Skip notice (default setup active)
        if: steps.default_setup.outputs.state == 'configured'
        run: echo "CodeQL default setup is enabled at the repository level; workflow analysis disabled to avoid the advanced-configuration conflict."
      - name: Install Rust 1.94+
        if: steps.default_setup.outputs.state != 'configured'
        run: rustup toolchain install 1.94.0 --profile minimal
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: steps.default_setup.outputs.state != 'configured'
      - name: Initialize CodeQL
        if: steps.default_setup.outputs.state != 'configured'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL Analysis
        if: steps.default_setup.outputs.state != 'configured'
        # GitHub rejects workflow-config SARIF uploads while default setup is
        # enabled (and the state probe above can 404 for the Actions token).
        # continue-on-error keeps the job green in that case; default setup
        # still analyzes every push and PR at the platform level.
        continue-on-error: true
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:rust"
