name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing, artifact attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.94+
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v${PACKAGE_VERSION}" = "${TAG_NAME}"
      - name: Build
        run: cargo +1.94.0 build --release --locked --bin figma-import
      - name: Package assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp target/release/figma-import dist/figma-import-linux-x86_64
          cp LICENSE README.md dist/
          tar -czf "dist/figma-import-${TAG_NAME}-linux-x86_64.tar.gz" -C dist figma-import-linux-x86_64 LICENSE README.md
          (cd dist && sha256sum "figma-import-${TAG_NAME}-linux-x86_64.tar.gz" > SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artifacts (keyless sigstore)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          for f in "figma-import-${TAG_NAME}-linux-x86_64.tar.gz" SHA256SUMS; do
            cosign sign-blob --yes \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp \
                "^https://github.com/Tasmanian-Cloud/figma-import/\.github/workflows/release\.yml@refs/tags/${TAG_NAME//./\\.}$" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              "$f"
          done
      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/figma-import-*-linux-x86_64.tar.gz"
      - name: Attach provenance bundle to the release assets
        env:
          BUNDLE_B64: ${{ steps.attest.outputs.bundle }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          echo "$BUNDLE_B64" | base64 -d > "figma-import-${TAG_NAME}-linux-x86_64.tar.gz.intoto.jsonl"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG_NAME" \
            "figma-import-${TAG_NAME}-linux-x86_64.tar.gz" \
            "figma-import-${TAG_NAME}-linux-x86_64.tar.gz.sig" \
            "figma-import-${TAG_NAME}-linux-x86_64.tar.gz.cert" \
            "figma-import-${TAG_NAME}-linux-x86_64.tar.gz.intoto.jsonl" \
            SHA256SUMS SHA256SUMS.sig SHA256SUMS.cert \
            --generate-notes

  container:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image (with SLSA provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
