[package]
name = "figma-import"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
description = "HTTP service: upload a Figma .fig file, get back a normalized PenDocument JSON tree (page/frame/text/layout/image-ref) via ZSeven-W/openpencil's op-figma parser."

[lib]
name = "figma_import"
path = "src/lib.rs"

[[bin]]
name = "figma-import"
path = "src/main.rs"

[dependencies]
# Real Kiwi-binary .fig parser — vendored upstream, not reimplemented here.
# Pinned to a specific commit (not a floating branch) so this service's
# parsing behaviour doesn't silently drift when upstream changes op-figma.
op-figma = { git = "https://github.com/ZSeven-W/openpencil.git", rev = "e6c9bcef45c5b48b38f42824d56b5513178e1a0b", package = "op-figma" }

axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7", features = ["trace", "limit", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Builds the representative fixture the test suite and `examples/make_fixture.rs`
# exercise (`src/fixtures.rs`) — a real Kiwi-encoded `.fig` container, deflate-
# compressed the same way an actual export is. Not test-only in Cargo's eyes
# (fixtures.rs is a normal lib module) so it lives in [dependencies], not
# [dev-dependencies].
flate2 = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
